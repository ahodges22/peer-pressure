<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Peer Pressure logo: two chevrons pressing inward on a central block">
  <title>Peer Pressure</title>
  <defs>
    <linearGradient id="pp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="44" fill="url(#pp-bg)"/>

  <!-- Two peers closing in from opposite sides. The gap either side of the centre
       is what makes this read as pressure rather than as an X (a close icon) —
       keep it. Distinct colours because the two reviewers are deliberately
       different models, never the same one. -->
  <path d="M40 58 L74 100 L40 142" fill="none" stroke="#E8815F"
        stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M160 58 L126 100 L160 142" fill="none" stroke="#5EEAD4"
        stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The work caught between them. -->
  <rect x="90" y="82" width="20" height="36" rx="7" fill="#F8FAFC"/>
</svg>
